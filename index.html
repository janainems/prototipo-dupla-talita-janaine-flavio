<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArenaCash — Indique um amigo e ganhe R$ 50</title>
<style>
  :root {
    --preto: #0a0a0a;
    --vermelho-900: #3a0a0a;
    --vermelho-600: #d81f2f;
    --vermelho-400: #ff6b6b;
    --branco: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--preto);
    color: var(--branco);
    -webkit-font-smoothing: antialiased;
  }

  .deck {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide {
    position: relative;
    width: 100%;
    max-width: 1280px;
    aspect-ratio: 16 / 9;
    max-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 7%;
    background:
      radial-gradient(900px 600px at 85% 15%, rgba(216, 31, 47, .55), transparent 60%),
      radial-gradient(700px 500px at 10% 90%, rgba(255, 107, 107, .25), transparent 65%),
      linear-gradient(135deg, var(--preto) 0%, var(--vermelho-900) 100%);
  }

  /* Formas decorativas */
  .slide::before,
  .slide::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
  }
  .slide::before {
    width: 520px; height: 520px;
    right: -140px; top: -160px;
    border: 1px solid rgba(255, 255, 255, .16);
  }
  .slide::after {
    width: 340px; height: 340px;
    right: -40px; bottom: -140px;
    background: rgba(255, 107, 107, .18);
    filter: blur(10px);
  }

  .conteudo { position: relative; z-index: 2; max-width: 760px; }

  .marca {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .marca .logo {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: linear-gradient(140deg, var(--vermelho-400), var(--branco));
    display: grid;
    place-items: center;
    color: var(--preto);
    font-size: 1.2rem;
    font-weight: 800;
    letter-spacing: 0;
  }

  .selo {
    display: inline-block;
    padding: 8px 18px;
    margin-bottom: 26px;
    border: 1px solid rgba(255, 255, 255, .28);
    border-radius: 999px;
    background: rgba(255, 255, 255, .07);
    font-size: .82rem;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--vermelho-400);
  }

  h1 {
    font-size: clamp(2.6rem, 6.2vw, 5rem);
    line-height: 1.04;
    font-weight: 800;
    letter-spacing: -.02em;
  }
  h1 .destaque {
    background: linear-gradient(90deg, var(--branco), var(--vermelho-400));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
  }

  .subtitulo {
    margin-top: 26px;
    max-width: 620px;
    font-size: clamp(1rem, 1.6vw, 1.35rem);
    line-height: 1.55;
    color: rgba(255, 255, 255, .78);
  }

  .btn {
    display: inline-block;
    margin-top: 44px;
    padding: 18px 46px;
    border-radius: 999px;
    background: var(--vermelho-600);
    color: var(--branco);
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 18px 40px rgba(0, 0, 0, .55);
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .btn:hover {
    transform: translateY(-3px);
    background: var(--vermelho-400);
    box-shadow: 0 24px 52px rgba(0, 0, 0, .65);
  }

  .rodape {
    position: absolute;
    left: 7%; right: 7%; bottom: 5%;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: .82rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, .5);
  }

  @media (max-width: 720px) {
    .slide { aspect-ratio: auto; height: 100vh; padding: 0 8%; }
    .rodape { display: none; }
  }
</style>
</head>
<body>
  <main class="deck">
    <!-- Slide 1 — Capa -->
    <section class="slide">
      <div class="conteudo">
        <div class="marca">
          <span class="logo">A</span>
          ArenaCash
        </div>

        <span class="selo">Programa de indicação</span>

        <h1>Indique um amigo<br>e ganhe <span class="destaque">R$ 50</span></h1>

        <p class="subtitulo">
          Cada amigo que abrir a conta ArenaCash pelo seu link coloca R$ 50
          direto na sua carteira. Sem limite de indicações.
        </p>

        <a class="btn" href="#">Saiba mais</a>
      </div>

      <footer class="rodape">
        <span>ArenaCash · 2026</span>
        <span>01</span>
      </footer>
    </section>
  </main>
</body>
</html>
